name: Validate portfolio

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate structure, metadata and local links
        run: python scripts/validate_site.py
      - name: Check JavaScript syntax
        run: node --check script.js
